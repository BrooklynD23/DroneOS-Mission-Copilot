name: sim

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        run: pipx install uv==0.13.1
      - name: Sync deps
        run: uv sync --project sim --locked
      - name: Ruff check
        run: uv run --project sim ruff check sim
      - name: Ruff format check
        run: uv run --project sim ruff format --check sim
      - name: Pytest
        run: uv run --project sim pytest -q sim/tests
