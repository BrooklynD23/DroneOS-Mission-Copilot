[project]
name = "droneos-sim"
version = "0.1.0"
description = "DroneOS Mission Copilot sim package"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mavsdk-grpc==4.0.5",
    "shapely==2.2.0",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["droneos_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=droneos_sim --cov-config=sim/pyproject.toml --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
# ponytail: sitl.py is a SITL-only runner exercised manually via HUMAN-05, not in CI.
omit = ["*/droneos_sim/sitl.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
